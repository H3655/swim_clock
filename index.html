<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swim Pace Clock</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Mörkt tema ── */
    :root, [data-theme="dark"] {
      --bg:      #0d1018;
      --surface: #13161f;
      --border:  #252c40;
      --text:    #ffffff;
      --muted:   #6b748f;
      --accent:  #00d4ff;
      --time-glow: rgba(0,212,255,.5);
      --shadow-clock:
        0 0 0 2px #000,
        0 0 0 7px #1a2035,
        0 0 0 9px #000,
        0 0 80px rgba(0,0,0,.9),
        0 0 120px rgba(0,212,255,.1),
        0 8px 50px rgba(0,0,0,.8);
    }

    /* ── Ljust tema ── */
    [data-theme="light"] {
      --bg:      #c8d4e8;
      --surface: #ffffff;
      --border:  #9aacc8;
      --text:    #000000;
      --muted:   #4a5878;
      --accent:  #0044bb;
      --time-glow: rgba(0,68,187,.15);
      --shadow-clock:
        0 0 0 2px #6a7a9a,
        0 0 0 7px #b0bcd4,
        0 0 0 9px #6a7a9a,
        0 4px 50px rgba(0,0,0,.35),
        0 8px 40px rgba(0,68,187,.12);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
      transition: background .3s, color .3s;
    }

    /* ── Tema-väljare ── */
    #themeToggle {
      position: fixed;
      top: 14px; right: 18px;
      z-index: 100;
      display: flex;
      gap: 2px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 3px;
      transition: border-color .3s, background .3s;
    }
    .theme-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: background .2s, color .2s;
      white-space: nowrap;
    }
    .theme-btn.active {
      background: var(--accent);
      color: #fff;
    }
    [data-theme="light"] .theme-btn.active { color: #fff; }
    .theme-btn:not(.active):hover { color: var(--accent); }

    /* ── Helskärmsknapp ── */
    #fsBtn {
      position: fixed;
      top: 14px; right: 220px;
      z-index: 100;
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color .2s, color .2s, background .3s;
    }
    #fsBtn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Titel / digital tid ── */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 50;
    }
    #header .label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: .25em;
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent);
    }
    #digitalTime {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 52px;
      letter-spacing: .1em;
      color: var(--text);
      text-shadow: 0 0 20px var(--time-glow);
      transition: color .3s, text-shadow .3s;
    }

    /* ── Huvud-layout ── */
    #app {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 100%;
      height: 100vh;
      padding-top: 68px; /* headerens höjd */
    }

    /* ── Vänster: fyra räknare ── */
    #counters {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .counter-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 6px 14px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0px;
      transition: background .3s, border-color .3s;
    }
    .counter-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: .22em;
      text-transform: uppercase;
      margin-bottom: 0;
    }
    .counter-canvas {
      display: block;
    }

    /* ── Analog klocka ── */
    #clockWrap {
      position: relative;
      flex-shrink: 0;
    }
    #clockCanvas {
      display: block;
      border-radius: 50%;
      box-shadow: var(--shadow-clock);
      transition: box-shadow .4s;
    }
  </style>
</head>
<body>

<!-- Tema-väljare -->
<div id="themeToggle">
  <button class="theme-btn active" data-mode="system">⊙ AUTO</button>
  <button class="theme-btn" data-mode="dark">◑ MÖRKT</button>
  <button class="theme-btn" data-mode="light">○ LJUST</button>
</div>

<!-- Helskärmsknapp -->
<button id="fsBtn">⛶ FULLSCREEN</button>

<!-- Topprad med tid -->
<div id="header">
  <span class="label">SWIM PACE CLOCK</span>
  <div id="digitalTime">00:00:00</div>
</div>

<!-- Huvud -->
<div id="app">

  <!-- Vänster: räknare -->
  <div id="counters">
    <!-- Skapas dynamiskt av JS -->
  </div>

  <!-- Analog klocka -->
  <div id="clockWrap">
    <canvas id="clockCanvas"></canvas>
  </div>

</div>

<script>
// ── Konfiguration ──────────────────────────────────────────────────
const HANDS = [
  { label: 'BLÅ',  offset: 0,  color: '#3b9dff', glow: 'rgba(59,157,255,.6)'  },
  { label: 'GUL',  offset: 15, color: '#ffd533', glow: 'rgba(255,213,51,.6)'   },
  { label: 'RÖD',  offset: 30, color: '#ff4b5c', glow: 'rgba(255,75,92,.6)'    },
  { label: 'GRÖN', offset: 45, color: '#3ddc84', glow: 'rgba(61,220,132,.6)'   },
];

// ── Temadefinitioner (canvas-färger) ──────────────────────────────
const THEMES = {
  dark: {
    // Urtavla: nästan svart för maximal kontrast
    bezel0: '#1e2438', bezel1: '#0e1118', bezel2: '#050608',
    face0:  '#0a0c12', face1:  '#080a10', face2:  '#050608',
    deco:   'rgba(0,212,255,0.06)',
    // Kvartalssiffror (0/15/30/45): stora, vita, cyan-glow
    tickQ:  '#00e5ff', tickQglow: 'rgba(0,229,255,0.9)',
    numQ:   '#ffffff', numQglow:  'rgba(0,229,255,0.6)',
    // 5-sekundersmarkörer: klart gul-vit, tydlig
    tick5:  '#c8d4e8', num5: '#d0ddf0',
    // Minutmarkörer: synliga men diskreta
    tick1:  '#3a4460',
    rotRing: 'rgba(0,212,255,0.25)',
    hub0:   '#2a3450', hub1: '#141a2a', hub2: '#080c14',
    hubIn0: '#1e2840', hubIn1: '#080c16',
    hubRing: 'rgba(0,229,255,0.3)',
    hubDot:  '#00e5ff', hubDotGlow: 'rgba(0,229,255,1)',
    hubHL:   'rgba(255,255,255,0.25)',
    counterShadow: 'rgba(0,0,0,0.9)',
    accent: '#00d4ff',
  },
  light: {
    // Urtavla: rent vit för maximal kontrast mot svarta siffror
    bezel0: '#8090aa', bezel1: '#606878', bezel2: '#404858',
    face0:  '#ffffff', face1:  '#f8f9fc', face2:  '#f0f3f8',
    deco:   'rgba(0,40,120,0.06)',
    // Kvartalssiffror: mörkblå på vit = max kontrast
    tickQ:  '#001a66', tickQglow: 'rgba(0,26,102,0.0)',
    numQ:   '#000000', numQglow:  'rgba(0,0,0,0.0)',
    // 5-sekundersmarkörer: mörkgrå, tydliga
    tick5:  '#334466', num5: '#334466',
    // Minutmarkörer: grå
    tick1:  '#8898bb',
    rotRing: 'rgba(0,40,140,0.2)',
    hub0:   '#8090aa', hub1: '#606878', hub2: '#404858',
    hubIn0: '#d0d8ea', hubIn1: '#b0bcd0',
    hubRing: 'rgba(0,40,140,0.35)',
    hubDot:  '#0033aa', hubDotGlow: 'rgba(0,51,170,0.8)',
    hubHL:   'rgba(255,255,255,0.7)',
    counterShadow: 'rgba(220,228,240,0.9)',
    accent: '#0044bb',
  }
};

let T = THEMES.dark; // aktivt tema-objekt

// ── DOM ────────────────────────────────────────────────────────────
const clockCanvas  = document.getElementById('clockCanvas');
const clockCtx     = clockCanvas.getContext('2d');
const digitalTime  = document.getElementById('digitalTime');
const countersDiv  = document.getElementById('counters');
const fsBtn        = document.getElementById('fsBtn');
const themeToggle  = document.getElementById('themeToggle');
const html         = document.documentElement;

// ── Tema-logik ─────────────────────────────────────────────────────
let userMode = 'system'; // 'system' | 'dark' | 'light'

const mq = window.matchMedia('(prefers-color-scheme: dark)');

function applyTheme() {
  const isDark = userMode === 'dark'
    || (userMode === 'system' && mq.matches);
  const name = isDark ? 'dark' : 'light';
  html.setAttribute('data-theme', name);
  T = THEMES[name];
}

// Lyssna på systemändring (när läge är "system")
mq.addEventListener('change', () => {
  if (userMode === 'system') applyTheme();
});

// Klick på tema-knapparna
themeToggle.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    userMode = btn.dataset.mode;
    themeToggle.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyTheme();
  });
});

// Starta med system-tema
applyTheme();

// ── Räknar-canvasar ────────────────────────────────────────────────
const counterCanvases = HANDS.map(h => {
  const card = document.createElement('div');
  card.className = 'counter-card';
  const lbl = document.createElement('div');
  lbl.className = 'counter-label';
  lbl.textContent = h.label;
  lbl.style.color = h.color;
  const cv = document.createElement('canvas');
  cv.className = 'counter-canvas';
  card.appendChild(lbl);
  card.appendChild(cv);
  countersDiv.appendChild(card);
  return cv;
});

// ── Storlekar ──────────────────────────────────────────────────────
let canvasSize, radius, center;

function resize() {
  const headerH = document.getElementById('header').offsetHeight;
  const availH  = window.innerHeight - headerH - 48;
  const availW  = window.innerWidth  - 20;
  const clockArea = Math.min(availW - 250, availH);
  canvasSize = Math.max(200, clockArea - 40);
  clockCanvas.width  = canvasSize;
  clockCanvas.height = canvasSize;
  radius = canvasSize / 2 - 28;
  center = canvasSize / 2;
  const cW = Math.min(220, availW - canvasSize - 60);
  const cH = Math.round(canvasSize / 4.4);
  counterCanvases.forEach(cv => { cv.width = cW; cv.height = cH; });
}
window.addEventListener('resize', resize);
resize();

// ── Helskärm ───────────────────────────────────────────────────────
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
    fsBtn.textContent = '✕ AVSLUTA';
  } else {
    document.exitFullscreen();
    fsBtn.textContent = '⛶ FULLSCREEN';
  }
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) fsBtn.textContent = '⛶ FULLSCREEN';
  setTimeout(resize, 50);
});

// ── Hjälpfunktioner ────────────────────────────────────────────────
function deg2rad(d) { return d * Math.PI / 180; }
function pad2(n)    { return String(Math.floor(n)).padStart(2, '0'); }

function shadeColor(hex, amt) {
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,Math.max(0,r+amt))},${Math.min(255,Math.max(0,g+amt))},${Math.min(255,Math.max(0,b+amt))})`;
}

// ── Rita analog klocka ─────────────────────────────────────────────
function drawClock(secondsPrecise) {
  const ctx = clockCtx;
  ctx.clearRect(0, 0, canvasSize, canvasSize);
  const outerR = radius + 26;

  // Bezel
  const bezelGrad = ctx.createRadialGradient(
    center - outerR * 0.2, center - outerR * 0.2, outerR * 0.5,
    center, center, outerR
  );
  bezelGrad.addColorStop(0,   T.bezel0);
  bezelGrad.addColorStop(0.6, T.bezel1);
  bezelGrad.addColorStop(1,   T.bezel2);
  ctx.fillStyle = bezelGrad;
  ctx.beginPath();
  ctx.arc(center, center, outerR, 0, Math.PI * 2);
  ctx.fill();

  // Bezel-highlight
  const hlGrad = ctx.createLinearGradient(
    center - outerR, center - outerR, center + outerR, center + outerR
  );
  hlGrad.addColorStop(0,   'rgba(255,255,255,0.14)');
  hlGrad.addColorStop(0.4, 'rgba(255,255,255,0.03)');
  hlGrad.addColorStop(1,   'rgba(0,0,0,0.15)');
  ctx.strokeStyle = hlGrad;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(center, center, outerR - 1, 0, Math.PI * 2);
  ctx.stroke();

  // Urtavla
  const faceGrad = ctx.createRadialGradient(center, center, 0, center, center, radius);
  faceGrad.addColorStop(0,    T.face0);
  faceGrad.addColorStop(0.55, T.face1);
  faceGrad.addColorStop(1,    T.face2);
  ctx.fillStyle = faceGrad;
  ctx.beginPath();
  ctx.arc(center, center, radius + 2, 0, Math.PI * 2);
  ctx.fill();

  // Dekorringar
  ctx.strokeStyle = T.deco;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(center, center, radius - 2, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(center, center, radius * 0.72, 0, Math.PI * 2); ctx.stroke();

  // ── Tick-markörer och siffror ── storlek för pool-avstånd
  const fontSizeQ = Math.round(canvasSize / 10);  // Kvartalssiffror: stora
  const fontSize5 = Math.round(canvasSize / 14);  // 5-sek siffror: mellanstora
  for (let s = 0; s < 60; s++) {
    const angle = deg2rad(s * 6 - 90);
    const cos = Math.cos(angle), sin = Math.sin(angle);

    if (s % 15 === 0) {
      // ── Kvartals-tick: bred, lång, starkt färgad ──
      ctx.save();
      ctx.strokeStyle = T.tickQ;
      ctx.lineWidth   = 6;
      ctx.lineCap     = 'round';
      ctx.shadowColor = T.tickQglow;
      ctx.shadowBlur  = 12;
      ctx.beginPath();
      ctx.moveTo(center + (radius - 24) * cos, center + (radius - 24) * sin);
      ctx.lineTo(center + radius         * cos, center + radius         * sin);
      ctx.stroke();
      ctx.restore();

      // Stor siffra — ljus/mörk med stark kontrast
      ctx.save();
      ctx.font = `bold ${fontSizeQ}px 'Bebas Neue', sans-serif`;
      ctx.fillStyle   = T.numQ;
      ctx.shadowColor = T.numQglow;
      ctx.shadowBlur  = T.numQglow.includes('0.0') ? 0 : 14;
      ctx.textAlign   = 'center';
      ctx.textBaseline = 'middle';
      const nr1 = s === 0 ? 60 : s;
      ctx.fillText(nr1,
        center + (radius - 56) * cos,
        center + (radius - 56) * sin);
      ctx.restore();

    } else if (s % 5 === 0) {
      // ── 5-sek tick: medeltjock ──
      ctx.save();
      ctx.strokeStyle = T.tick5;
      ctx.lineWidth   = 3.5;
      ctx.lineCap     = 'round';
      ctx.beginPath();
      ctx.moveTo(center + (radius - 18) * cos, center + (radius - 18) * sin);
      ctx.lineTo(center + radius         * cos, center + radius         * sin);
      ctx.stroke();
      ctx.restore();

      // Siffra vid 5:e
      ctx.save();
      ctx.font = `bold ${fontSize5}px 'Bebas Neue', sans-serif`;
      ctx.fillStyle   = T.num5;
      ctx.textAlign   = 'center';
      ctx.textBaseline = 'middle';
      const nr2 = s === 0 ? 60 : s;
      ctx.fillText(nr2,
        center + (radius - 46) * cos,
        center + (radius - 46) * sin);
      ctx.restore();

    } else {
      // ── Minutmarkörer ──
      ctx.strokeStyle = T.tick1;
      ctx.lineWidth   = 1.5;
      ctx.lineCap     = 'round';
      ctx.beginPath();
      ctx.moveTo(center + (radius - 10) * cos, center + (radius - 10) * sin);
      ctx.lineTo(center + radius          * cos, center + radius          * sin);
      ctx.stroke();
    }
  }

  // Roterande dekorring
  const squareAngle = deg2rad((secondsPrecise * 6) % 360 - 45);
  drawSquare(ctx, squareAngle);

  // Visare
  HANDS.forEach(h => {
    const angle = deg2rad(((secondsPrecise + h.offset) % 60) * 6 - 90);
    drawPaddle(ctx, angle, h.color, h.glow);
  });

  // Nav
  drawHub(ctx);
}

// ── Paddel-visare ──────────────────────────────────────────────────
const HUB_R = 30;

function drawPaddle(ctx, angle, color, glow) {
  const L     = radius - 30;
  const BW    = 22;
  const TW    = 4;
  const baseR = HUB_R + 4;
  const ax = Math.cos(angle), ay = Math.sin(angle);
  const px = -ay, py = ax;
  const b0 = { x: center + ax * baseR, y: center + ay * baseR };
  const bl = { x: b0.x + px * BW,     y: b0.y + py * BW };
  const br = { x: b0.x - px * BW,     y: b0.y - py * BW };
  const tip = { x: center + ax * L,   y: center + ay * L };
  const tl  = { x: tip.x + px * TW,  y: tip.y + py * TW };
  const tr  = { x: tip.x - px * TW,  y: tip.y - py * TW };

  ctx.save();
  ctx.shadowColor = glow;
  ctx.shadowBlur  = 28;

  const grad = ctx.createLinearGradient(b0.x, b0.y, tip.x, tip.y);
  grad.addColorStop(0,   shadeColor(color, -40));
  grad.addColorStop(0.3, color);
  grad.addColorStop(0.8, color);
  grad.addColorStop(1,   shadeColor(color, 60));

  ctx.beginPath();
  ctx.moveTo(bl.x, bl.y);
  ctx.lineTo(tl.x, tl.y);
  ctx.lineTo(tip.x, tip.y);
  ctx.lineTo(tr.x, tr.y);
  ctx.lineTo(br.x, br.y);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.shadowBlur  = 0;
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth   = 1.5;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth   = 1;
  ctx.beginPath();
  ctx.moveTo(b0.x + ax * 6,     b0.y + ay * 6);
  ctx.lineTo(tip.x - ax * 10,   tip.y - ay * 10);
  ctx.stroke();
  ctx.restore();
}

// ── Roterande dekorring ────────────────────────────────────────────
function drawSquare(ctx, angle) {
  ctx.save();
  ctx.translate(center, center);
  ctx.rotate(angle);
  ctx.strokeStyle = T.rotRing;
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 10]);
  ctx.beginPath();
  ctx.arc(0, 0, HUB_R + 10, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

// ── Dekorativt nav ─────────────────────────────────────────────────
function drawHub(ctx) {
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur  = 20;

  const outerGrad = ctx.createRadialGradient(center-8, center-8, 2, center, center, HUB_R);
  outerGrad.addColorStop(0,   T.hub0);
  outerGrad.addColorStop(0.4, T.hub1);
  outerGrad.addColorStop(1,   T.hub2);
  ctx.fillStyle = outerGrad;
  ctx.beginPath();
  ctx.arc(center, center, HUB_R, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(center, center, HUB_R - 1, 0, Math.PI * 2);
  ctx.stroke();

  const innerGrad = ctx.createRadialGradient(center-4, center-4, 1, center, center, 16);
  innerGrad.addColorStop(0, T.hubIn0);
  innerGrad.addColorStop(1, T.hubIn1);
  ctx.fillStyle = innerGrad;
  ctx.beginPath();
  ctx.arc(center, center, 16, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = T.hubRing;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(center, center, 16, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle   = T.hubDot;
  ctx.shadowColor = T.hubDotGlow;
  ctx.shadowBlur  = 14;
  ctx.beginPath();
  ctx.arc(center, center, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = T.hubHL;
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.arc(center, center, HUB_R - 3, Math.PI * 1.1, Math.PI * 1.7);
  ctx.stroke();
}

// ── Rita sekundräknare ─────────────────────────────────────────────
function drawCounter(cv, secondsPrecise, hand) {
  const ctx = cv.getContext('2d');
  const w = cv.width, h = cv.height;
  ctx.clearRect(0, 0, w, h);

  const val = pad2((secondsPrecise + hand.offset) % 60);
  const fs  = Math.round(h * 0.78);
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

  ctx.font = `bold ${fs}px 'Bebas Neue', sans-serif`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';

  if (isDark) {
    // Mörkt: svart kontur-pass för djup, sedan färgad text med stark glow
    ctx.fillStyle = 'rgba(0,0,0,1)';
    const offs = [-4,-2,0,2,4];
    offs.forEach(ox => offs.forEach(oy => {
      if (ox !== 0 || oy !== 0) ctx.fillText(val, w/2 + ox, h/2 + oy);
    }));
    ctx.shadowColor = hand.glow;
    ctx.shadowBlur  = 24;
    ctx.fillStyle   = hand.color;
    ctx.fillText(val, w/2, h/2);
    ctx.shadowBlur  = 0;
  } else {
    // Ljust: vit kontur-pass, sedan svart text = max kontrast
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    const offs = [-3,-1,0,1,3];
    offs.forEach(ox => offs.forEach(oy => {
      if (ox !== 0 || oy !== 0) ctx.fillText(val, w/2 + ox, h/2 + oy);
    }));
    ctx.fillStyle = '#000000';
    ctx.fillText(val, w/2, h/2);
    // Färgad understrykning
    const barH  = Math.max(4, h * 0.07);
    const barW  = w * 0.65;
    ctx.fillStyle = hand.color;
    ctx.shadowColor = hand.glow;
    ctx.shadowBlur  = 8;
    ctx.beginPath();
    ctx.roundRect(w/2 - barW/2, h - barH - 4, barW, barH, barH/2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// ── Huvudloop ──────────────────────────────────────────────────────
function loop() {
  const now = new Date();
  digitalTime.textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
  const secondsPrecise = now.getSeconds() + now.getMilliseconds() / 1000;
  drawClock(secondsPrecise);
  counterCanvases.forEach((cv, i) => drawCounter(cv, secondsPrecise, HANDS[i]));
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
